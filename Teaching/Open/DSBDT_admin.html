<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>零食优化挑战赛｜教师控制台</title>
<link rel="stylesheet" href="./challenge-ui.css">
<style>
#teacher-view.projector #login-card,#teacher-view.projector #control-card,#teacher-view.projector header .sub{display:none}
#teacher-view.projector .ranking{font-size:22px}#teacher-view.projector .ranking td{padding:13px 8px}
#teacher-view.projector{max-width:1200px}
</style>
</head>
<body>
<div class="wrap" id="teacher-view">
<header><div class="spaced"><h1>🎓 零食优化挑战赛</h1><span class="pill">教师控制台</span></div><p class="sub">创建比赛 → 学生入场 → 10秒倒计时 → 30秒挑战 → 统一揭晓排行榜</p></header>
<div id="msg" class="notice hide" role="alert"></div>
<section class="card" id="login-card">
<h2>🔐 教师身份验证</h2>
<form id="token-form" class="row">
<div class="field"><label for="secret">ADMIN_TOKEN（在 Cloudflare 中配置的教师密钥）</label><input type="password" id="secret" required autocomplete="off" placeholder="请粘贴教师专用密钥"></div>
<button type="submit">进入教师控制台</button><button class="secondary" id="logout" type="button">退出</button>
</form><p class="hint">密钥只保存在当前浏览器标签页，不要投屏或分享给学生。不要在 GitHub 文件中写入密钥。</p>
</section>
<section id="control-card" class="card hide">
<h2>1. 创建或选择讲座</h2>
<form id="create-form" class="row">
<div class="field"><label for="lecture-name">讲座名称</label><input id="lecture-name" value="数学优化科普讲座" required maxlength="70"></div>
<button type="submit" class="green">＋ 创建新比赛</button>
</form>
<div class="row" style="margin-top:12px"><div class="field"><label for="session-select">已创建的比赛</label><select id="session-select" style="background:#0c1325;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:9px;width:100%"></select></div><button type="button" class="secondary" id="refresh-list">刷新比赛列表</button></div>
<div id="lecture-controls" class="hide">
<div class="notice"><div class="spaced"><div><small>本场讲座口令</small><div class="code" id="join-code">——</div></div><span class="pill" id="phase">等待学生</span></div><p style="margin-bottom:0">学生网址：<a id="student-url" target="_blank" rel="noopener noreferrer" href="#">打开学生页面</a></p><div class="row" style="margin-top:12px"><button class="secondary" id="copy-link" type="button">复制学生参赛链接</button><button class="secondary" id="copy-code" type="button">复制讲座口令</button></div></div>
<div class="grid3"><div class="metric"><small>已入场</small><div class="number" id="joined">0</div></div><div class="metric"><small>已同步购物车</small><div class="number" id="submitted">0</div></div><div class="metric"><small>有效成绩</small><div class="number" id="valid">0</div></div></div>
<div class="row" style="margin-top:18px"><button class="green" id="start" type="button">▶ 统一开始（10秒倒计时）</button><button class="orange" id="reveal" type="button">🏆 统一公布成绩</button><span class="quiet" id="time-status"></span></div>
</div>
</section>
<section class="card hide" id="ranking-card">
<div class="spaced"><h2>🏆 本场排行榜（前20名）</h2><button class="secondary" id="projection" type="button">投屏显示 / 退出投屏</button></div>
<p class="hint" id="leader-note">比赛开始后自动显示排名，学生只有在教师公布后才能看到。</p>
<div style="overflow-x:auto"><table class="ranking"><thead><tr><th>排名</th><th>昵称</th><th>满意度</th><th>花费</th></tr></thead><tbody id="ranking-body"></tbody></table></div>
<div class="notice hide" id="optimal-result"></div>
</section>
</div>
<script src="./challenge-config.js"></script>
<script>
(()=>{
'use strict';
const $=x=>document.getElementById(x), API=(window.SNACK_API_BASE||'').replace(/\/$/,'');
const configured=API.startsWith('https://')&&!API.includes('REPLACE-WITH');
const state={secret:sessionStorage.getItem('snack_admin_token')||'',sessions:[],sessionId:sessionStorage.getItem('snack_session_id')||'',current:null,loading:false,offset:0};
const esc=x=>String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function notify(s,bad=false){$('msg').textContent=s;$('msg').className=bad?'notice error':'notice success';}
function clearMessage(){$('msg').classList.add('hide');}
async function api(path,method='GET',body=null){
 if(!configured)throw Error('请先修改 challenge-config.js 中的 Worker URL');
 if(!state.secret)throw Error('请先输入教师密钥');
 const res=await fetch(API+path,{method,headers:{'Content-Type':'application/json','Authorization':`Bearer ${state.secret}`},body:body===null?undefined:JSON.stringify(body),cache:'no-store'});
 const result=await res.json();if(!res.ok||result.ok===false)throw Error(result.error||`请求失败（${res.status}）`);return result;
}
function updateVisibility(){
 $('control-card').classList.toggle('hide',!state.secret);
 $('ranking-card').classList.toggle('hide',!state.current);
 $('lecture-controls').classList.toggle('hide',!state.current);
}
async function listSessions(){
 const r=await api('/api/admin/sessions');state.sessions=r.sessions;
 $('session-select').innerHTML=r.sessions.map(s=>`<option value="${s.id}">${esc(s.title)} / ${s.code} / ${s.date}</option>`).join('');
 if(!r.sessions.length){state.current=null;updateVisibility();return;}
 if(!r.sessions.some(x=>x.id===state.sessionId))state.sessionId=r.sessions[0].id;
 $('session-select').value=state.sessionId;
 await updateCurrent();
}
function userUrl(code){const u=new URL('./DSBDT_app1_test.html',location.href);u.searchParams.set('code',code);return u.href;}
function determinePhase(s){
 if(s.phase==='revealed')return 'revealed';
 if(!s.startAt)return 'waiting';
 const now=Date.now()+state.offset;
 if(now<s.startAt)return 'countdown';
 if(now<s.endAt)return 'running';
 return 'ended';
}
function updateClock(){
 const s=state.current;if(!s)return;
 const phase=determinePhase(s);
 $('phase').textContent=({waiting:'等待学生',countdown:'10秒准备',running:'30秒挑战中',ended:'等待公布',revealed:'已公布'})[phase];
 $('phase').className='pill'+(phase==='running'?' ok':phase==='ended'?' wait':'');
 $('start').disabled=phase!=='waiting';$('reveal').disabled=phase!=='ended';
 if(phase==='countdown')$('time-status').textContent=`距离开赛 ${Math.max(0,Math.ceil((s.startAt-(Date.now()+state.offset))/1000))} 秒`;
 else if(phase==='running')$('time-status').textContent=`剩余 ${Math.max(0,(s.endAt-(Date.now()+state.offset))/1000).toFixed(1)} 秒`;
 else if(phase==='ended')$('time-status').textContent='时间到，可以公布成绩';
 else if(phase==='revealed')$('time-status').textContent='学生已可以查看结果';
 else $('time-status').textContent='请确认学生全部入场后开始';
}
async function updateCurrent(){
 if(!state.sessionId||state.loading)return;
 state.loading=true;
 try{
 const r=await api(`/api/admin/leaderboard?id=${encodeURIComponent(state.sessionId)}`);
 state.current=r.session;state.offset=r.session.serverNow-Date.now();
 const s=r.session;
 $('join-code').textContent=s.code;
 const u=userUrl(s.code);$('student-url').href=u;$('student-url').textContent=u;
 $('joined').textContent=r.stats.joined;$('submitted').textContent=r.stats.submitted;$('valid').textContent=r.stats.valid;
 $('ranking-body').innerHTML=r.leaders.length?r.leaders.slice(0,20).map(x=>`<tr><td>${x.place}</td><td>${esc(x.nickname)}</td><td>${x.score}</td><td>${x.cost} 元</td></tr>`).join(''):'<tr><td colspan="4">暂无有效成绩</td></tr>';
 const showOptimal=determinePhase(s)==='revealed';
 $('optimal-result').classList.toggle('hide',!showOptimal);
 if(showOptimal){
   const names=['🥔 薯片','🥤 可乐','🍫 巧克力','🍎 鲜切水果'];
   $('optimal-result').innerHTML=`<b>⚡ 全局最优满意度：${r.optimal.score}</b><p class="quiet">最优组合：${r.optimal.combo.map((q,i)=>q?`${names[i]} × ${q}`:'').filter(Boolean).join('、')}</p>`;
 }
 $('leader-note').textContent=showOptimal?'成绩已向学生公布。':'教师预览排名：学生尚不能查看，直到点击“统一公布成绩”。';
 updateVisibility();updateClock();
 }catch(e){notify(e.message,true);}finally{state.loading=false;}
}
$('token-form').addEventListener('submit',async e=>{e.preventDefault();state.secret=$('secret').value.trim();sessionStorage.setItem('snack_admin_token',state.secret);try{await listSessions();clearMessage();updateVisibility();}catch(e){notify(e.message,true);state.secret='';sessionStorage.removeItem('snack_admin_token');updateVisibility();}});
$('logout').addEventListener('click',()=>{state.secret='';sessionStorage.removeItem('snack_admin_token');state.current=null;updateVisibility();$('secret').value='';notify('已退出教师控制台。');});
$('create-form').addEventListener('submit',async e=>{
 e.preventDefault();const btn=e.submitter;btn.disabled=true;
 try{const r=await api('/api/admin/create','POST',{title:$('lecture-name').value});state.sessionId=r.id;sessionStorage.setItem('snack_session_id',r.id);await listSessions();notify(`新比赛已创建！讲座口令：${r.code}`);}
 catch(err){notify(err.message,true);}finally{btn.disabled=false;}
});
$('session-select').addEventListener('change',async e=>{state.sessionId=e.target.value;sessionStorage.setItem('snack_session_id',state.sessionId);await updateCurrent();});
$('refresh-list').addEventListener('click',()=>listSessions().catch(e=>notify(e.message,true)));
$('start').addEventListener('click',async()=>{
 if(!state.current)return;
 if(!confirm(`确认立即启动「${state.current.title}」？学生将有10秒准备，随后进行30秒正式比赛。`))return;
 $('start').disabled=true;
 try{await api('/api/admin/start','POST',{sessionId:state.current.id});await updateCurrent();notify('比赛启动成功！所有学生开始10秒倒计时。');}catch(e){notify(e.message,true);await updateCurrent();}
});
$('reveal').addEventListener('click',async()=>{
 if(!state.current||!confirm('确认向所有学生公开排行榜与算法最优解？'))return;
 $('reveal').disabled=true;
 try{await api('/api/admin/reveal','POST',{sessionId:state.current.id});await updateCurrent();notify('排行榜与算法最优解已经公布。');}catch(e){notify(e.message,true);await updateCurrent();}
});
$('copy-link').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(userUrl(state.current.code));notify('学生参赛链接已复制，可制作为二维码放在 PPT 中。');}catch{notify('复制失败，请手动复制上面的学生网址。',true);}});
$('copy-code').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(state.current.code);notify('讲座口令已复制。');}catch{notify('复制失败，请手动复制口令。',true);}});
$('projection').addEventListener('click',()=>{$('teacher-view').classList.toggle('projector');});
if(!configured)notify('需要先配置 Cloudflare Worker 地址：challenge-config.js。',true);
$('secret').value=state.secret;
if(state.secret)listSessions().then(()=>{updateVisibility();}).catch(e=>notify(e.message,true));
setInterval(updateClock,100);
setInterval(()=>{if(state.secret&&state.sessionId)updateCurrent();},2200);
})();
</script>
</body>
</html>
